<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قارئ كود QR — يعمل مضمون</title>
<style>
    *{box-sizing:border-box;}
    body{
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background:#f4f7f6;margin:0;padding:20px;color:#333;line-height:1.7;
    }
    .container{max-width:640px;margin:0 auto;}
    h1{text-align:center;color:#2c3e50;}
    .sub{text-align:center;color:#7f8c8d;font-size:14px;margin-bottom:25px;}
    .card{
        background:#fff;padding:22px;border-radius:10px;
        box-shadow:0 4px 10px rgba(0,0,0,.08);margin-bottom:25px;
    }
    h2{margin-top:0;color:#1abc9c;border-bottom:2px solid #ecf0f1;
        padding-bottom:10px;font-size:19px;}
    input[type="file"]{
        width:100%;padding:12px;margin:10px 0;border:2px dashed #bdc3c7;
        border-radius:8px;background:#fafafa;cursor:pointer;font-family:inherit;
    }
    input[type="file"]:hover{border-color:#1abc9c;background:#e8f8f5;}
    .result-box{
        margin-top:15px;padding:15px;border-radius:8px;
        word-break:break-all;font-size:15px;display:none;
    }
    .result-ok{background:#e8f8f5;color:#0e6655;border-right:4px solid #1abc9c;}
    .result-err{background:#fdecea;color:#c0392b;border-right:4px solid #e74c3c;}
    .result-loading{background:#fef9e7;color:#7d6608;border-right:4px solid #f1c40f;}
    #preview{
        max-width:100%;margin-top:15px;border-radius:8px;
        display:none;border:1px solid #ecf0f1;
    }
    .copy-btn{
        background:transparent;color:#1abc9c;border:1px solid #1abc9c;
        font-size:13px;padding:6px 14px;margin-top:10px;border-radius:4px;
        cursor:pointer;font-family:inherit;font-weight:bold;
    }
    .copy-btn:hover{background:#1abc9c;color:#fff;}
    .spinner{
        display:inline-block;width:16px;height:16px;
        border:3px solid #f1c40f;border-top-color:transparent;
        border-radius:50%;animation:spin 0.8s linear infinite;
        vertical-align:middle;margin-left:8px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="container">
    <h1>📷 قارئ كود QR</h1>
    <p class="sub">يعمل مباشرة في المتصفح — بدون أي تعقيد</p>

    <div class="card">
        <h2>اختر صورة كود QR</h2>
        <input type="file" id="qrFile" accept="image/*">
        <img id="preview" alt="معاينة">
        <div id="result" class="result-box"></div>
    </div>
</div>

<!-- مكتبة jsQR احتياطية فقط إذا لم يدعم المتصفح BarcodeDetector -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>
const fileInput = document.getElementById('qrFile');
const preview = document.getElementById('preview');
const resultBox = document.getElementById('result');

fileInput.addEventListener('change', handleFile);

function showResult(html, cls) {
    resultBox.style.display = 'block';
    resultBox.className = 'result-box ' + cls;
    resultBox.innerHTML = html;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
}

async function handleFile() {
    const file = fileInput.files[0];
    if (!file) return;

    resultBox.style.display = 'none';
    preview.style.display = 'none';

    // عرض الصورة
    const dataUrl = await new Promise(res => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.readAsDataURL(file);
    });
    preview.src = dataUrl;
    preview.style.display = 'block';

    showResult('<span class="spinner"></span> جاري قراءة كود QR...', 'result-loading');

    // تحميل الصورة في عنصر Image
    const img = new Image();
    img.src = dataUrl;
    await new Promise(res => { img.onload = res; });

    try {
        let text = null;

        // 1) استخدام BarcodeDetector إذا كان مدعومًا (الأسرع والأدق)
        if ('BarcodeDetector' in window) {
            try {
                const detector = new BarcodeDetector({ formats: ['qr_code'] });
                const codes = await detector.detect(img);
                if (codes.length > 0) {
                    text = codes[0].rawValue;
                }
            } catch (e) {
                console.warn('BarcodeDetector فشل، سننتقل إلى jsQR:', e);
            }
        }

        // 2) إذا لم ينجح BarcodeDetector، نستخدم jsQR
        if (!text && typeof jsQR === 'function') {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code) text = code.data;
        }

        // عرض النتيجة
        if (text) {
            window._lastQRResult = text;
            showResult(
                '✅ <b>المحتوى المستخرج:</b><br>' +
                '<div style="margin-top:10px;padding:10px;background:#fff;border-radius:6px;">' +
                escapeHtml(text) + '</div>' +
                '<button class="copy-btn" onclick="copyResult()">📋 نسخ المحتوى</button>',
                'result-ok'
            );
        } else {
            showResult('❌ لم نتمكن من العثور على كود QR في هذه الصورة. تأكد من وضوح الصورة.', 'result-err');
        }
    } catch (err) {
        console.error(err);
        showResult('❌ حدث خطأ أثناء المعالجة: ' + (err.message || 'خطأ غير معروف'), 'result-err');
    }
}

function copyResult() {
    if (window._lastQRResult) {
        navigator.clipboard.writeText(window._lastQRResult).then(
            () => alert('تم نسخ المحتوى ✅'),
            () => alert('تعذّر النسخ')
        );
    }
}
</script>

</body>
</html>
